name: HA Editor
version: "0.1.7"
slug: ha_editor
description: A minimal file tree and Monaco editor for your Home Assistant configuration
url: https://github.com/j4n-e4t/ha-editor
image: ghcr.io/j4n-e4t/{arch}-addon-ha_editor
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:file-document-edit-outline
panel_title: Editor
panel_admin: true
map:
  - type: homeassistant_config
    path: /config
    read_only: false
options:
  show_config_folder: true
  hidden: []
  vim_mode: false
schema:
  show_config_folder: bool
  hidden:
    - str
  vim_mode: bool
